name: ECS Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  REGION: us-west-2
  REPOSITORY: wsc-cicd-ecr
  CLUSTER: wsc-cicd-ecs-cluster
  SERVICE: wsc-cicd-ecs-svc
  TASK_FAMILY: wsc-cicd-ecs-taskdef
  CONTAINER: wsc-cicd-ecs-cnt

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Configure 
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: Login ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Image Tag
        id: tag
        shell: bash
        run: |
          CURRENT=$(aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --region "$REGION" \
            --query 'sort_by(imageDetails,&imagePushedAt)[-1].imageTags[0]' \
            --output text 2>/dev/null)

          if [[ "$CURRENT" == "None" || -z "$CURRENT" ]]; then
              TAG="v1.0.0"
          else
              VERSION=${CURRENT#v}
              IFS='.' read MAJOR MINOR PATCH <<< "$VERSION"
              PATCH=$((PATCH+1))
              TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build Image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE=$REGISTRY/$REPOSITORY:$IMAGE_TAG

          docker build -t $IMAGE .
          docker push $IMAGE

          echo "IMAGE_URI=$IMAGE" >> $GITHUB_ENV

      - name: Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $TASK_FAMILY \
            --query taskDefinition \
            > taskdef.json

      - name: Container Image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: taskdef.json
          container-name: ${{ env.CONTAINER }}
          image: ${{ env.IMAGE_URI }}

      - name: ECS Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          cluster: ${{ env.CLUSTER }}
          service: ${{ env.SERVICE }}
          task-definition: ${{ steps.render.outputs.task-definition }}
          wait-for-service-stability: false

      - name: Deployment
        shell: bash
        run: |
          aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query "services[0].deployments[*].[status,rolloutState]" \
            --output table