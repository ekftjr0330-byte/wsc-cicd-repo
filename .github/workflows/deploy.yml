name: Deploy to Amazon ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: wsc-cicd-ecr
  ECS_CLUSTER: wsc-cicd-ecs-cluster
  ECS_SERVICE_NAME: wsc-cicd-ecs-svc
  ECS_TASK_DEFINITION: wsc-cicd-ecs-taskdef
  ECS_CONTAINER: wsc-cicd-ecs-cnt

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine next image tag
        shell: bash
        run: |
          TAGS=$(aws ecr list-images --region "$AWS_REGION" --repository-name "$ECR_REPOSITORY" --filter tagStatus=TAGGED --query 'imageIds[].imageTag' --output text)

          LATEST=$(printf '%s\n' "$TAGS" | tr '\t ' '\n' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)

          if [ -z "$LATEST" ]; then
            IMAGE_TAG="v1.0.0"
          else
            VERSION="${LATEST#v}"
            MAJOR="${VERSION%%.*}"
            REMAINDER="${VERSION#*.}"
            MINOR="${REMAINDER%%.*}"
            PATCH="${REMAINDER##*.}"

            IMAGE_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "Next Image Tag: $IMAGE_TAG"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build-image
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "Pushed Image: $IMAGE_URI"

      - name: Verify ECS Native Blue Green
        shell: bash
        run: |
          read -r CONTROLLER STRATEGY <<< "$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE_NAME" --region "$AWS_REGION" --query 'services[0].[deploymentController.type,deploymentConfiguration.strategy]' --output text)"

          echo "Deployment Controller: $CONTROLLER"
          echo "Deployment Strategy: $STRATEGY"

          if [ "$CONTROLLER" != "ECS" ] || [ "$STRATEGY" != "BLUE_GREEN" ]; then
            echo "ECS Service is not configured for Native Blue/Green."
            exit 1
          fi

      - name: Download task definition
        shell: bash
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_TASK_DEFINITION" --region "$AWS_REGION" --query taskDefinition --output json > taskdef.json

      - name: Render new task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: taskdef.json
          container-name: ${{ env.ECS_CONTAINER }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE_NAME }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-max-delay-seconds: 15